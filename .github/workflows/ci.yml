name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy --strict src

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
      - name: Run the installed CLI
        working-directory: ${{ runner.temp }}
        run: |
          source clean/bin/activate
          wavguard --version
          python - <<'EOF'
          import wave
          with wave.open("ok.wav", "wb") as w:
              w.setnchannels(3)
              w.setsampwidth(3)
              w.setframerate(48000)
              w.writeframes(bytes(4800 * 9))
          data = open("ok.wav", "rb").read()
          open("cut.wav", "wb").write(data[:-4])
          EOF
          python -m wavguard ok.wav
          set +e
          python -m wavguard cut.wav
          status=$?
          set -e
          test "$status" -eq 1
